<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgFounderCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B13"/>
      <stop offset="50%" stop-color="#083324"/>
      <stop offset="100%" stop-color="#0F5132"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B2C"/>
    </linearGradient>

    <!-- Emerald Glow Behind Portrait -->
    <radialGradient id="founderAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#083324" stop-opacity="0"/>
    </radialGradient>

    <!-- Circular Clip for Portrait Elements -->
    <clipPath id="circleClip">
      <circle cx="180" cy="180" r="166"/>
    </clipPath>
  </defs>

  <!-- Outer Ring Shadow & Golden Border -->
  <circle cx="180" cy="180" r="176" stroke="url(#goldRing)" stroke-width="3" stroke-dasharray="8 3" opacity="0.85"/>
  <circle cx="180" cy="180" r="170" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>

  <!-- Main Circular Container with Clip -->
  <g clip-path="url(#circleClip)">
    <!-- Deep Forest Green Background -->
    <circle cx="180" cy="180" r="168" fill="url(#bgFounderCircle)"/>

    <!-- Subtle Islamic Geometric Star Background Pattern -->
    <g opacity="0.08" stroke="#D4AF37" stroke-width="1">
      <circle cx="180" cy="180" r="135"/>
      <circle cx="180" cy="180" r="95"/>
      <polygon points="180,60 210,135 285,150 230,200 240,275 180,240 120,275 130,200 75,150 150,135"/>
      <rect x="110" y="110" width="140" height="140" fill="none"/>
      <rect x="110" y="110" width="140" height="140" transform="rotate(45 180 180)" fill="none"/>
    </g>

    <!-- Aura Glow Behind Silhouette -->
    <ellipse cx="180" cy="160" rx="115" ry="115" fill="url(#founderAura)"/>

    <!-- Founder Portrait Silhouette / Vector -->
    <g transform="translate(80, 50)">
      <!-- Shoulders / Blazer -->
      <path d="M-15 280 L25 185 L65 175 L100 220 L135 175 L175 185 L215 280 Z" fill="#09181F"/>
      <!-- Lapels & Coat Edges -->
      <path d="M40 185 L65 245 L100 262 L135 245 L160 185 L135 175 L100 198 L65 175 Z" fill="#0D261E" stroke="url(#goldRing)" stroke-width="1"/>
      
      <!-- White Collared Shirt -->
      <polygon points="65,175 100,230 135,175 100,168" fill="#FFFFFF"/>
      
      <!-- Emerald & Gold Striped Tie -->
      <polygon points="95,185 105,185 109,255 100,268 91,255" fill="#065F46"/>
      <line x1="93" y1="202" x2="107" y2="207" stroke="#D4AF37" stroke-width="1.2"/>
      <line x1="93" y1="222" x2="107" y2="227" stroke="#D4AF37" stroke-width="1.2"/>
      <line x1="95" y1="242" x2="105" y2="247" stroke="#D4AF37" stroke-width="1.2"/>

      <!-- Neck -->
      <path d="M84 145 L84 178 Q100 190 116 178 L116 145 Z" fill="#D2A082"/>

      <!-- Head / Face -->
      <ellipse cx="100" cy="118" rx="38" ry="48" fill="#D2A082"/>
      
      <!-- Professional Hair -->
      <path d="M62 112 C60 78 80 58 100 58 C120 58 140 78 138 112 C132 86 118 76 100 76 C82 76 68 86 62 112 Z" fill="#1C1917"/>
      
      <!-- Trimmed Beard & Moustache -->
      <path d="M70 124 C70 162 84 174 100 174 C116 174 130 162 130 124 C130 140 122 158 100 158 C78 158 70 140 70 124 Z" fill="#1C1917"/>
      <path d="M86 136 Q100 130 114 136 Q100 141 86 136 Z" fill="#1C1917"/>
      
      <!-- Eyebrows -->
      <path d="M78 107 Q88 103 95 106" stroke="#1C1917" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M105 106 Q112 103 122 107" stroke="#1C1917" stroke-width="2.2" stroke-linecap="round"/>
      
      <!-- Eyes & Focus -->
      <circle cx="87" cy="114" r="3.2" fill="#1C1917"/>
      <circle cx="113" cy="114" r="3.2" fill="#1C1917"/>
      <circle cx="88" cy="113" r="1" fill="#FFFFFF"/>
      <circle cx="114" cy="113" r="1" fill="#FFFFFF"/>
      
      <!-- Modern Gold Tech Glasses -->
      <rect x="76" y="107" width="20" height="14" rx="4" stroke="#D4AF37" stroke-width="1.4" fill="none" opacity="0.9"/>
      <rect x="104" y="107" width="20" height="14" rx="4" stroke="#D4AF37" stroke-width="1.4" fill="none" opacity="0.9"/>
      <line x1="96" y1="113" x2="104" y2="113" stroke="#D4AF37" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Verified Badge Ring at Bottom Right of Portrait -->
  <g transform="translate(245, 245)">
    <circle cx="20" cy="20" r="22" fill="#083324" stroke="url(#goldRing)" stroke-width="2"/>
    <circle cx="20" cy="20" r="16" fill="#059669"/>
    <path d="M14 20 L18 24 L26 16" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
