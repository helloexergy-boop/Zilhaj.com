<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <pattern id="islamicGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- 8-pointed star in center -->
      <polygon points="60,20 68,44 92,36 78,56 96,72 72,76 68,100 52,82 28,92 40,70 20,56 44,48" stroke="#D4AF37" stroke-width="0.75" fill="none" opacity="0.25"/>
      <!-- Outer intersecting octagon & square lines -->
      <rect x="30" y="30" width="60" height="60" stroke="#10B981" stroke-width="0.6" fill="none" opacity="0.15"/>
      <rect x="30" y="30" width="60" height="60" transform="rotate(45 60 60)" stroke="#10B981" stroke-width="0.6" fill="none" opacity="0.15"/>
      <!-- Corner quarter stars -->
      <circle cx="0" cy="0" r="18" stroke="#D4AF37" stroke-width="0.6" fill="none" opacity="0.2"/>
      <circle cx="120" cy="0" r="18" stroke="#D4AF37" stroke-width="0.6" fill="none" opacity="0.2"/>
      <circle cx="0" cy="120" r="18" stroke="#D4AF37" stroke-width="0.6" fill="none" opacity="0.2"/>
      <circle cx="120" cy="120" r="18" stroke="#D4AF37" stroke-width="0.6" fill="none" opacity="0.2"/>
      <circle cx="60" cy="60" r="32" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#islamicGrid)"/>
</svg>
