    <circle cx="25" cy="13" r="1.5" fill="url(#goldGradW)"/>
  </g>

  <!-- Brand Typography -->
  <text x="62" y="35" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="26" letter-spacing="1.5" fill="#FFFFFF">ZILHAJ</text>
  <text x="174" y="27" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="12" letter-spacing="0.5" fill="#E5C158">.COM</text>
  
  <!-- Tagline underneath -->
  <text x="63" y="49" font-family="'Inter', sans-serif" font-weight="500" font-size="7.5" letter-spacing="0.8" fill="#A7F3D0">HAJJ &amp; UMRAH PILGRIMAGE PLATFORM</text>
